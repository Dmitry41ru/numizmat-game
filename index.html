<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1915">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NUMIZMAT — коллекционная игра о банкнотах. Скоро старт.">
  <title>NUMIZMAT — Скоро старт</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1915;
      --bg-deep: #081310;
      --gold: #e4c888;
      --gold-bright: #ffdf9b;
      --gold-muted: #b39b67;
      --text: #f2f1e8;
      --muted: #a0b2a9;
      --line: rgba(223, 196, 135, .20);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg-deep); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      background:
        radial-gradient(ellipse 82% 37% at 50% 34%, rgba(36, 93, 68, .31), transparent 80%),
        radial-gradient(ellipse 100% 60% at 50% -14%, rgba(208, 169, 88, .085), transparent 75%),
        linear-gradient(178deg, #0e211b 0%, #0b1915 52%, #071310 100%);
      color: var(--text);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .26;
      background-image:
        linear-gradient(rgba(214, 187, 129, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(214, 187, 129, .035) 1px, transparent 1px);
      background-size: 27px 27px;
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 13%, black 65%, transparent);
      mask-image: linear-gradient(to bottom, transparent, black 13%, black 65%, transparent);
    }
    .page {
      position: relative;
      isolation: isolate;
      width: min(100%, 540px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      gap: 10px;
    }
    .monogram {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(237, 200, 126, .61);
      border-radius: 11px;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 3px rgba(8, 22, 16, .85), inset 0 0 0 4px rgba(237, 200, 126, .17);
      color: var(--gold-bright);
      background: linear-gradient(135deg, rgba(213, 184, 110, .13), rgba(25, 61, 43, .5));
      font-family: Georgia, serif;
      font-size: 24px;
      font-weight: bold;
      line-height: 1;
    }
    .wordmark {
      color: #f0dfb6;
      font-size: 16px;
      font-weight: 850;
      letter-spacing: .27em;
      line-height: 1;
    }
    main {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px 0 26px;
    }
    .art {
      position: relative;
      width: min(100%, 425px);
      height: clamp(215px, 32vh, 270px);
      min-height: 0;
      display: grid;
      place-items: center;
      margin: -3px auto 12px;
      flex-shrink: 0;
    }
    .art::before {
      content: "";
      position: absolute;
      width: min(78vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(228, 197, 130, .11);
      box-shadow:
        0 0 0 22px rgba(228, 197, 130, .025),
        0 0 0 64px rgba(228, 197, 130, .022),
        0 0 80px 4px rgba(144, 121, 70, .10);
    }
    .art::after {
      content: "";
      position: absolute;
      width: 66%;
      height: 18px;
      bottom: 6px;
      background: rgba(0, 0, 0, .54);
      filter: blur(19px);
      border-radius: 50%;
    }
    .art svg {
      position: relative;
      z-index: 1;
      display: block;
      width: min(100%, 420px);
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.24));
      animation: float 6s ease-in-out infinite;
    }
    .sparkle {
      position: absolute;
      z-index: 2;
      color: var(--gold);
      font-size: 14px;
      opacity: .8;
      text-shadow: 0 0 12px rgba(255, 215, 132, .4);
      animation: glow 3s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .sparkle.one { top: 24%; left: 4%; }
    .sparkle.two { top: 14%; right: 8%; font-size: 11px; animation-delay: 1s; }
    .sparkle.three { bottom: 18%; right: 1%; font-size: 10px; animation-delay: 1.7s; }
    .eyebrow {
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .26em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      max-width: 470px;
      font-weight: 850;
      line-height: .99;
      letter-spacing: -.035em;
      font-size: clamp(43px, 10.3vw, 68px);
      text-wrap: balance;
    }
    h1 .line { display: block; }
    h1 .accent {
      background: linear-gradient(105deg, #b49359, #f4d69b 47%, #d4ac6b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-bottom: 6px;
    }
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      width: 170px;
      margin: 13px 0 13px;
      color: var(--gold-muted);
    }
    .ornament::before, .ornament::after {
      content: "";
      height: 1px;
      width: 100%;
      background: linear-gradient(90deg, transparent, rgba(212, 172, 107, .55));
    }
    .ornament::after { transform: rotate(180deg); }
    .ornament span { font-size: 13px; line-height: 1; }
    .lead {
      margin: 0;
      color: #e5e8dc;
      font-size: clamp(16px, 4.3vw, 19px);
      font-weight: 620;
      line-height: 1.45;
      max-width: 320px;
      text-wrap: balance;
    }
    .detail {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      max-width: 345px;
      text-wrap: balance;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--line);
      background: rgba(24, 52, 39, .60);
      padding: 11px 17px;
      margin-top: 26px;
      border-radius: 999px;
      color: #d7ceb6;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .01em;
    }
    .status i {
      display: inline-block;
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      background: #e3bf74;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(230, 193, 117, .12), 0 0 15px rgba(230,193,117,.35);
      animation: glow 1.9s ease-in-out infinite alternate;
    }
    .bottom {
      width: 100%;
      margin-top: auto;
      padding-top: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
    }
    .closing {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: #869c8f;
    }
    .close {
      appearance: none;
      border-radius: 14px;
      border: 1px solid rgba(229, 200, 144, .29);
      background: rgba(46, 77, 60, .41);
      color: #ecd7ad;
      font: 650 14px/1.25 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: min(100%, 310px);
      min-height: 46px;
      padding: 12px 18px;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }
    .close:hover { background: rgba(54, 89, 69, .65); border-color: rgba(229, 200, 144, .5); }
    .close:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .hidden { display: none !important; }
    @keyframes float { 0%, 100% { transform: translateY(1px) rotate(-.5deg); } 50% { transform: translateY(-9px) rotate(.5deg); } }
    @keyframes glow { from { opacity: .4; } to { opacity: 1; } }
    @media (max-height: 760px) {
      .page { padding-top: calc(17px + env(safe-area-inset-top)); padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
      .art { height: clamp(170px, 28vh, 220px); margin-bottom: 2px; }
      main { padding: 7px 0 13px; }
      .eyebrow { margin-bottom: 9px; }
      .ornament { margin: 8px 0; }
      .status { margin-top: 16px; }
      .detail { margin-top: 8px; }
    }
    @media (max-width: 350px) {
      .page { padding-left: 17px; padding-right: 17px; }
      .wordmark { font-size: 14px; }
      .art { height: clamp(175px, 28vh, 220px); }
      h1 { font-size: 42px; }
      .detail { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .art svg, .sparkle, .status i { animation: none !important; }
      .close { transition: none; }
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="page">
    <header class="top" aria-label="NUMIZMAT">
      <span class="monogram" aria-hidden="true">N</span>
      <span class="wordmark">NUMIZMAT</span>
    </header>

    <main>
      <div class="art" aria-hidden="true">
        <span class="sparkle one">✦</span><span class="sparkle two">✧</span><span class="sparkle three">✦</span>
        <svg viewBox="0 0 440 275" role="img" aria-label="Коллекционная банкнота NUMIZMAT" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#496650"/><stop offset="1" stop-color="#243d32"/></linearGradient>
            <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#204a39"/><stop offset=".52" stop-color="#193b2d"/><stop offset="1" stop-color="#0e2b21"/></linearGradient>
            <linearGradient id="frame" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#b38b50"/><stop offset=".5" stop-color="#f5da99"/><stop offset="1" stop-color="#a57c46"/></linearGradient>
            <radialGradient id="seal"><stop stop-color="#e3bd78"/><stop offset=".73" stop-color="#906c3d"/><stop offset="1" stop-color="#e2c78b"/></radialGradient>
            <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#000" flood-opacity=".4"/></filter>
            <pattern id="mesh" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 0L9 9M9 0L0 9" stroke="#c5d4b1" stroke-width=".34" opacity=".23"/></pattern>
            <pattern id="lines" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="8.5" cy="8.5" r="6.1" fill="none" stroke="#e0c88a" stroke-width=".34" opacity=".28"/></pattern>
          </defs>
          <g transform="translate(56 22) rotate(-13 165 108)">
            <rect width="332" height="202" rx="10" fill="#153126" stroke="#866f46" stroke-width="2"/>
            <rect x="8" y="8" width="316" height="186" rx="5" fill="url(#back)" stroke="#ad9b6b" stroke-width="1.1"/>
            <rect x="16" y="16" width="300" height="170" fill="url(#mesh)"/>
            <circle cx="166" cy="101" r="62" fill="none" stroke="#d9c38e" stroke-opacity=".5" stroke-width="1"/>
          </g>
          <g transform="translate(44 37) rotate(9 166 103)">
            <rect width="332" height="202" rx="10" fill="#173528" stroke="#968052" stroke-width="2"/>
            <rect x="8" y="8" width="316" height="186" rx="5" fill="#214638" stroke="#ccb17b" stroke-width="1"/>
            <rect x="16" y="16" width="300" height="170" fill="url(#lines)"/>
            <circle cx="166" cy="101" r="61" fill="none" stroke="#cbb886" stroke-opacity=".45" stroke-width="1"/>
          </g>
          <g transform="translate(36 46) rotate(-4 176 100)" filter="url(#shadow)">
            <rect x="0" y="0" width="352" height="202" rx="9" fill="url(#front)" stroke="url(#frame)" stroke-width="2.5"/>
            <rect x="7.5" y="7.5" width="337" height="187" rx="4" stroke="#e9c885" stroke-width=".8" fill="none" opacity=".77"/>
            <rect x="14" y="14" width="324" height="174" rx="2" stroke="#9f915f" stroke-width=".75" fill="url(#mesh)"/>
            <rect x="21" y="21" width="310" height="160" stroke="#a1aa81" stroke-opacity=".45" stroke-width=".6" fill="none"/>
            <g fill="none" stroke="#d4bf80" opacity=".30">
              <circle cx="177" cy="99" r="84" stroke-width=".8"/>
              <circle cx="177" cy="99" r="77" stroke-width=".7"/>
              <circle cx="177" cy="99" r="68" stroke-width=".7" stroke-dasharray="2 3"/>
              <path d="M21 88Q55 22 89 88T157 88T225 88T293 88T331 88M21 112Q55 178 89 112T157 112T225 112T293 112T331 112" stroke-width=".85"/>
              <path d="M21 50Q73 114 125 50T229 50T331 50M21 148Q73 84 125 148T229 148T331 148" stroke-width=".6"/>
            </g>
            <circle cx="177" cy="100" r="59" fill="#102d23" stroke="#c1a16c" stroke-width="1"/>
            <circle cx="177" cy="100" r="52" fill="none" stroke="#ebce8c" stroke-opacity=".55" stroke-dasharray="1 3" stroke-width="2"/>
            <circle cx="177" cy="100" r="44" fill="url(#seal)" stroke="#e8d9ac" stroke-width=".6"/>
            <circle cx="177" cy="100" r="36" fill="none" stroke="#664d2b" stroke-opacity=".60" stroke-width="1.5"/>
            <text x="177" y="113" text-anchor="middle" fill="#273829" font-family="Georgia,serif" font-size="42" font-weight="bold">N</text>
            <g fill="#e8d098" text-anchor="middle" font-family="Georgia,serif">
              <text x="62" y="61" font-size="29">100</text><text x="292" y="61" font-size="29">100</text>
              <text x="64" y="154" font-size="9" letter-spacing="2">КРОН</text>
              <text x="290" y="154" font-size="9" letter-spacing="2">КРОН</text>
              <text x="177" y="27" font-size="9" font-weight="bold" letter-spacing="2.4">NUMIZMAT</text>
              <text x="177" y="178" font-size="8" letter-spacing="2">AA 0000001</text>
            </g>
            <g fill="#e2ca8e" opacity=".6"><circle cx="26" cy="26" r="2.3"/><circle cx="326" cy="26" r="2.3"/><circle cx="26" cy="176" r="2.3"/><circle cx="326" cy="176" r="2.3"/></g>
          </g>
        </svg>
      </div>

      <div class="eyebrow">Коллекционная игра о банкнотах</div>
      <h1><span class="line">СКОРО</span><span class="line accent">СТАРТ</span></h1>
      <div class="ornament" aria-hidden="true"><span>✦</span></div>
      <p class="lead">Твоя коллекция начинается с первой банкноты.</p>
      <p class="detail">Печатай банкноты, находи редкие номера и собирай уникальные серии.</p>
      <div class="status" role="status"><i aria-hidden="true"></i><span>Готовим NUMIZMAT к запуску</span></div>
    </main>

    <footer class="bottom">
      <button class="close hidden" type="button" id="close-app">Вернуться в Telegram</button>
      <p class="closing">Дата запуска будет объявлена позже.</p>
    </footer>
  </div>
  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (!tg || !tg.initData) return;
      try { tg.ready(); tg.expand(); } catch (e) { /* browser fallback */ }
      try { if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#0b1915'); } catch (e) {}
      try { if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#0b1915'); } catch (e) {}
      const close = document.getElementById('close-app');
      if (typeof tg.close === 'function') {
        close.classList.remove('hidden');
        close.addEventListener('click', () => tg.close());
      }
    })();
  </script>
</body>
</html>
